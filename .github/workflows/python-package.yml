name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project + dev tools
        run: |
          pip install -e .
          pip install ruff pytest

      # ─────────────────────────────────────
      # Lint: ruff (dead code, imports, errors)
      # ─────────────────────────────────────
      - name: Lint with ruff
        run: |
          ruff check .

      # ─────────────────────────────────────
      # Strict dead code detection
      # ─────────────────────────────────────
      - name: Dead code check (F401, F841)
        run: |
          ruff check . --select=F401,F841

      # ─────────────────────────────────────
      # Tests
      # ─────────────────────────────────────
      - name: Run tests
        run: |
          pytest
